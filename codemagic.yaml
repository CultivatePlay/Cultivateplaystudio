# Cloud builds for the WePlan Clock apps (no Mac needed). See apps/weplan-clock/README.md for setup.
# Codemagic reads this file from the repository root. Start each workflow by hand from the Codemagic dashboard.
workflows:
  ios-testflight:
    name: WePlan Clock iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # The name you give your App Store Connect API key in Codemagic (Team settings → Integrations).
      app_store_connect: WePlan Clock App Store Connect key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cultivateplay.weplanclock
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install packages and copy the app into the iOS project
        script: |
          cd apps/weplan-clock
          npm ci
          npm run build
          npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Set the build number
        script: |
          cd apps/weplan-clock/ios/App
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" App.xcodeproj/project.pbxproj
      - name: Build the app
        script: |
          cd apps/weplan-clock
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - apps/weplan-clock/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-play-internal:
    name: WePlan Clock Android → Google Play internal testing
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        # The name you give your upload keystore in Codemagic (Team settings → Code signing identities).
        - weplan_upload_key
      groups:
        # A variable group holding GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (your Google Play service account JSON).
        - google_play
      node: 22
      java: 21
    scripts:
      - name: Install packages and copy the app into the Android project
        script: |
          cd apps/weplan-clock
          npm ci
          npm run build
          npx cap sync android
      - name: Build the app bundle
        script: |
          cd apps/weplan-clock/android
          ./gradlew bundleRelease
    artifacts:
      - apps/weplan-clock/android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
